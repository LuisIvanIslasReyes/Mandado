<!doctype html>
<html lang="es">
  <body style="margin:0;padding:24px;background:#f8fafc;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#0f172a;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:420px;margin:0 auto;background:#ffffff;border:1px solid #e2e8f0;border-radius:12px;">
      <tr>
        <td style="padding:32px 28px;">
          <p style="margin:0 0 4px;font-size:14px;font-weight:600;color:#047857;">Mandado</p>
          <h1 style="margin:0 0 16px;font-size:22px;line-height:1.3;">Tu código para entrar</h1>
          <p style="margin:0 0 20px;font-size:16px;line-height:1.5;color:#475569;">
            Escribe este código en la app. Vence en una hora.
          </p>
          <p style="margin:0 0 24px;padding:16px;text-align:center;font-size:32px;font-weight:700;letter-spacing:8px;background:#ecfdf5;border-radius:8px;color:#064e3b;">
            {{ .Token }}
          </p>
          <p style="margin:0;font-size:14px;line-height:1.5;color:#64748b;">
            Si no fuiste tú, ignora este correo. Nadie puede entrar sin este código.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
